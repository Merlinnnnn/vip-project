events {}

http {
  # ─────────────────────────────────────────────
  # DEV MODE: services chạy trực tiếp trên host (npm run start:dev)
  # Chỉ có 1 instance mỗi service — không scale ở môi trường dev
  # Dùng dev-proxy.js thay vì file này khi phát triển cục bộ
  # ─────────────────────────────────────────────

  upstream auth_svc {
    server host.docker.internal:3000 max_fails=3 fail_timeout=30s;
  }

  upstream task_svc {
    server host.docker.internal:3001 max_fails=3 fail_timeout=30s;
  }

  server {
    listen 80;

    add_header Access-Control-Allow-Origin  *;
    add_header Access-Control-Allow-Headers *;
    add_header Access-Control-Allow-Methods GET,POST,PUT,DELETE,OPTIONS;

    if ($request_method = OPTIONS) {
      return 204;
    }

    location /auth/ {
      proxy_pass       http://auth_svc/api/auth/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
    }

    location /tasks/ {
      proxy_pass       http://task_svc/api/tasks/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
    }

    location /skills/ {
      proxy_pass       http://task_svc/api/skills/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
    }

    location /notifications/ {
      proxy_pass       http://task_svc/api/notifications/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;
    }

    # SSE Stream — cấu hình đặc biệt cho persistent connections
    location /notifications/stream {
      proxy_pass       http://task_svc/api/notifications/stream;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_buffering      off;
      proxy_cache          off;
      proxy_read_timeout   3600s;
      proxy_connect_timeout 5s;
      chunked_transfer_encoding on;
    }

    location /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","mode":"dev"}';
    }
  }
}
