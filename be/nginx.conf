# Số worker process = số CPU core (auto)
worker_processes auto;

events {
  worker_connections 1024;
}

http {
  # ─────────────────────────────────────────────
  # UPSTREAM: auth-service (3 replicas)
  # Docker DNS tự resolve "auth-service" → tất cả containers của service đó
  # least_conn: gửi request đến server có ít kết nối nhất
  # ─────────────────────────────────────────────
  upstream auth_svc {
    least_conn;
    server auth-service:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ─────────────────────────────────────────────
  # UPSTREAM: task-service (3 replicas)
  # Dùng least_conn vì các task request có thể nặng/nhẹ khác nhau
  # ─────────────────────────────────────────────
  upstream task_svc {
    least_conn;
    server task-service:3001 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  # ─────────────────────────────────────────────
  # Cấu hình kết nối upstream chung
  # ─────────────────────────────────────────────
  proxy_http_version 1.1;
  proxy_set_header Connection "";   # bật HTTP keep-alive với upstream

  server {
    listen 80;

    # CORS headers
    add_header Access-Control-Allow-Origin  *;
    add_header Access-Control-Allow-Headers *;
    add_header Access-Control-Allow-Methods GET,POST,PUT,DELETE,OPTIONS;

    if ($request_method = OPTIONS) {
      return 204;
    }

    # ── Auth service ──────────────────────────
    location /auth/ {
      proxy_pass       http://auth_svc/api/auth/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;

      # Tự retry sang instance khác nếu instance hiện tại lỗi
      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    # ── Task service ──────────────────────────
    location /tasks/ {
      proxy_pass       http://task_svc/api/tasks/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;

      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    # ── Skill service (thuộc task-service) ───
    location /skills/ {
      proxy_pass       http://task_svc/api/skills/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

      proxy_connect_timeout 5s;
      proxy_read_timeout    30s;

      proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
    }

    # ── Gateway health check ──────────────────
    location /health {
      add_header Content-Type application/json;
      return 200 '{"status":"ok","gateway":"nginx-lb"}';
    }
  }
}
