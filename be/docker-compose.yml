version: "3.8"

services:
  auth-service:
    build: ./services/auth-service
    env_file:
      - ./services/auth-service/.env
    # Không expose port ra host — nginx gọi nội bộ qua Docker network
    expose:
      - "3000"
    depends_on:
      - postgres
    deploy:
      replicas: 3          # Chạy 3 instance song song
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  task-service:
    build: ./services/task-service
    env_file:
      - ./services/task-service/.env
    # Không expose port ra host — nginx gọi nội bộ qua Docker network
    expose:
      - "3001"
    depends_on:
      - postgres
      - redis
    deploy:
      replicas: 3          # Chạy 3 instance song song
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - task-service

volumes:
  pgdata: {}
