version: "3.8"

services:
  auth-service:
    build: ./services/auth-service
    env_file:
      - ./services/auth-service/.env
    # Không expose port ra host — nginx gọi nội bộ qua Docker network
    expose:
      - "3000"
    depends_on:
      - postgres
      - rabbitmq
    deploy:
      replicas: 3          # Chạy 3 instance song song
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  task-service:
    build: ./services/task-service
    env_file:
      - ./services/task-service/.env
    # Không expose port ra host — nginx gọi nội bộ qua Docker network
    expose:
      - "3001"
    depends_on:
      - postgres
      - redis
      - rabbitmq
    deploy:
      replicas: 3          # Chạy 3 instance song song
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  notification-service:
    build: ./services/notification-service
    env_file:
      - ./services/notification-service/.env
    expose:
      - "3002"
    depends_on:
      - rabbitmq
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"      # AMQP protocol
      - "15672:15672"    # Management UI → http://localhost:15672 (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  gateway:
    image: nginx:alpine
    ports:
      - "9999:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - task-service

volumes:
  pgdata: {}
  rabbitmq_data: {}
